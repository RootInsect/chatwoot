# Chatwoot 本地全容器开发（源码挂载热更新）
# 本机只需 Docker，无需安装 Ruby。
#
#   .\deploy\dev-docker-up.ps1
#   ./deploy/dev-docker-up.sh
#
# Postgres/Redis 不映射到宿主机，避免与本机 6379 等冲突。

name: chatwoot-dev

x-app: &app
  image: chatwoot:development
  tty: true
  stdin_open: true
  env_file:
    - ../.env
  volumes:
    - ..:/app:cached
    - node_modules:/app/node_modules
    - packs:/app/public/packs
    - cache:/app/tmp/cache
    # 不挂载 /gems：空卷会盖住镜像预装 gems；开发依赖用镜像层 + 容器内 bundle install

services:
  rails:
    <<: *app
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        EXECJS_RUNTIME: Node
        RAILS_ENV: development
        RAILS_SERVE_STATIC_FILES: 'false'
    depends_on:
      - postgres
      - redis
      - vite
      - mailhog
      - sidekiq
    ports:
      # 宿主机 3000 常被其它服务占用；容器内仍听 3000
      - '3001:3000'
    environment:
      VITE_RUBY_HOST: vite
      VITE_RUBY_PORT: '3036'
      NODE_ENV: development
      RAILS_ENV: development
      # MiniProfiler JS/CSS currently 500 (Rack::File); disable to avoid broken badge flashes.
      DISABLE_MINI_PROFILER: 'true'
    # 先剥 CRLF 再执行，避免 Windows 挂载脚本在 Alpine 上失败
    entrypoint: ['sh', '-c', 'sed -i "s/\\r$//" docker/entrypoints/rails.sh docker/entrypoints/helpers/*.rb 2>/dev/null; exec sh docker/entrypoints/rails.sh "$$@"', '--']
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *app
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      VITE_RUBY_HOST: vite
      VITE_RUBY_PORT: '3036'
      NODE_ENV: development
      RAILS_ENV: development
    entrypoint: ['sh', '-c', 'sed -i "s/\\r$//" docker/entrypoints/rails.sh docker/entrypoints/helpers/*.rb 2>/dev/null; exec sh docker/entrypoints/rails.sh "$$@"', '--']
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  vite:
    <<: *app
    ports:
      - '3036:3036'
    environment:
      VITE_RUBY_HOST: 0.0.0.0
      VITE_DEV_SERVER_HOST: 0.0.0.0
      NODE_ENV: development
      RAILS_ENV: development
    # 跳过官方 vite.sh 的 pnpm install --force（每次重启极慢）；卷里已有依赖则直接起
    entrypoint:
      - sh
      - -c
      - |
        sed -i 's/\r$//' bin/vite 2>/dev/null || true
        bundle check || bundle install
        if [ ! -f node_modules/vite/package.json ]; then
          echo 'Installing JS deps (first run)...'
          pnpm install
        fi
        exec bundle exec vite dev


  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - postgres:/data/postgres
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ['redis-server']
    volumes:
      - redis:/data/redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - '8025:8025'

volumes:
  postgres:
  redis:
  packs:
  node_modules:
  cache:
