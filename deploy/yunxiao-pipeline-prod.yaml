sources:
  chatwoot_repo:
    type: codeup
    name: jingqi/chatwoot
    endpoint: https://codeup.aliyun.com/670498699d3c82efe37af916/jingqi/chatwoot.git
    branch: custom
    branchesFilter: ^custom$
    triggerEvents: push
    certificate:
      type: serviceConnection
      serviceConnection: d3x3chr79471y4o4

stages:
  deploy_stage:
    name: 部署
    jobs:
      deploy_job:
        name: 主机部署
        component: VMDeploy
        with:
          machineGroup: dv8BORtpmNoBXt1c
          artifactDownloadPath: /home/admin/app/package.tgz
          downloadArtifact: false
          needPackage: false
          executeUser: root
          pauseStrategy: firstBatchPause
          batchNumber: 1
          deployTimeoutPerHost: 600
          run: |
            bash <<'SCRIPT'
            set -eu
            # 禁止业务机 docker build。本机构建 push 后，这里只 pull + up。
            REGISTRY=100.65.76.62:5000
            IMAGE="${REGISTRY}/jingqi/chatwoot"
            TAG=prod-latest
            DEPLOY_DIR=/opt/1panel/apps/chatwoot/chatwoot-prod

            cd "$DEPLOY_DIR"
            if [ ! -f .env ]; then
              echo "Missing $DEPLOY_DIR/.env" >&2
              exit 1
            fi

            if grep -q '^IMAGE=' .env; then
              sed -i "s|^IMAGE=.*|IMAGE=${IMAGE}|" .env
            else
              echo "IMAGE=${IMAGE}" >> .env
            fi
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${TAG}/" .env
            else
              echo "IMAGE_TAG=${TAG}" >> .env
            fi

            # 依赖主机已 docker login 过私有库（/root/.docker/config.json）
            docker compose pull
            docker compose up -d
            docker compose run --rm rails bundle exec rails db:chatwoot_prepare
            docker compose up -d
            docker compose ps
            SCRIPT
